<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: transparent; }
  a { color: #E536A3; text-decoration: none; }
  a:hover { color: #0A1628; }
  #cxq *, #cxq *::before, #cxq *::after { box-sizing: border-box; }
  #cxq .cxa-card {
    width: 440px; min-height: 566px; position: relative; background: #fff;
    border: 1px solid rgba(10,22,40,.08); border-radius: 12px; box-shadow: 0 22px 52px rgba(10,22,40,.09);
    display: flex; flex-direction: column; overflow: hidden;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  }
  #cxq .cxa-topbar { position: absolute; left: 0; right: 0; top: 0; height: 3px; }
  #cxq .cxa-head { padding: 64px 30px 22px; display: flex; flex-direction: column; gap: 20px; }
  #cxq .cxa-headrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-left: 104px; }
  #cxq .cxa-lbl { font-family: 'Inter',system-ui,sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #8A94A6; }
  #cxq .cxa-tier { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 5px 13px; font-size: 12px; font-weight: 700; }
  #cxq .cxa-tier i { width: 6px; height: 6px; border-radius: 50%; }
  #cxq .cxa-idrow { display: flex; align-items: center; gap: 16px; }
  #cxq .cxa-tile { position: relative; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 14px; }
  #cxq .cxa-idcol { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  #cxq .cxa-id { font-size: 29px; font-weight: 800; letter-spacing: -.015em; color: #0A1628; line-height: 1.05; }
  #cxq .cxa-dev { font-family: 'Inter',system-ui,sans-serif; font-size: 13.5px; color: #6B7688; }
  #cxq .cxa-fields { padding: 0 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #cxq .cxa-fld { display: flex; flex-direction: column; gap: 5px; background: #f9fafb; border: 1px solid rgba(10,22,40,.07); border-radius: 10px; padding: 13px 14px; }
  #cxq .cxa-fld > span:first-child { display: flex; align-items: center; gap: 6px; font-family: 'Inter',system-ui,sans-serif; font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: #8A94A6; }
  #cxq .cxa-fld b { font-family: 'Inter',system-ui,sans-serif; font-size: 17px; font-weight: 600; color: #0A1628; }
  #cxq .cxa-foot { margin: 24px 0 0; padding: 24px 30px 28px; border-top: 1px solid rgba(10,22,40,.07); display: flex; align-items: center; gap: 22px; }
  #cxq .cxa-gauge { position: relative; width: 104px; height: 104px; flex: 0 0 auto; }
  #cxq .cxa-gauge .n { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: 'Inter',system-ui,sans-serif; }
  #cxq .cxa-gauge .n b { font-size: 26px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
  #cxq .cxa-gauge .n i { font-size: 11px; font-weight: 500; opacity: .65; font-style: normal; }
  #cxq .cxa-fcol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #cxq .cxa-fcol .k { font-family: 'Inter',system-ui,sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #8A94A6; }
  #cxq .cxa-fcol .big { font-family: 'Inter',system-ui,sans-serif; font-size: 46px; font-weight: 600; line-height: 1; letter-spacing: -.025em; }
  #cxq .cxa-segs { display: flex; align-items: center; gap: 9px; }
  #cxq .cxa-segs > span:first-child { display: flex; gap: 3px; }
  #cxq .cxa-segs i { width: 4px; height: 11px; border-radius: 2px; transition: background .5s ease; }
  #cxq .cxa-segs em { font-family: 'Inter',system-ui,sans-serif; font-size: 13.5px; color: #6B7688; font-style: normal; }
  #cxq .cxa-orb { position: absolute; left: -112px; top: -166px; width: 300px; height: 300px; }
  #cxq .cxa-halo { position: absolute; left: 50%; top: 50%; width: 216px; height: 216px; border-radius: 50%; border: 1.5px solid rgba(229, 54, 163,.28); opacity: 0; transform: translate(-50%,-50%); animation: cxaHalo 10s cubic-bezier(.42,0,.58,1) infinite; }
  #cxq .cxa-photo { position: absolute; left: 150px; top: 150px; transform: translate(-50%,-50%); width: 126px; height: 126px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 12px 32px rgba(10,22,40,.14); background: #eef1f5; overflow: hidden; }
  #cxq .cxa-photo i { position: absolute; inset: 0; border-radius: 50%; background-size: cover; background-repeat: no-repeat; }
  #cxq .cxa-scan { position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; border-radius: 50%; pointer-events: none; transform: translate(-50%,-50%); transition: background .7s ease; -webkit-mask: radial-gradient(circle at center,transparent 0 63px,#000 63.5px); mask: radial-gradient(circle at center,transparent 0 63px,#000 63.5px); animation: cxaScanSpin 7s linear .5s infinite; }
  #cxq .cxa-panel {
    position: relative; width: 940px; min-height: 724px;
    background: #fff; border: 1px solid rgba(10,22,40,.08); border-radius: 12px; box-shadow: 0 22px 52px rgba(10,22,40,.09);
    padding: 28px 34px 30px; display: flex; flex-direction: column; gap: 26px;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  }
  #cxq .cxa-ptop { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
  #cxq .cxa-ptop h3 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; color: #0A1628; }
  #cxq .cxa-ptop p { margin: 5px 0 0; font-family: 'Inter',system-ui,sans-serif; font-size: 14px; color: #6B7688; }
  #cxq .cxa-live { display: inline-flex; align-items: center; gap: 8px; background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.24); border-radius: 999px; padding: 6px 13px; flex: 0 0 auto; white-space: nowrap; font-family: 'Inter',system-ui,sans-serif; font-size: 12px; font-weight: 600; color: #16A34A; }
  #cxq .cxa-live i { width: 8px; height: 8px; border-radius: 50%; background: #22C55E; box-shadow: 0 0 0 3px rgba(34,197,94,.16); animation: cxaLive 2.6s cubic-bezier(.42,0,.58,1) infinite; }
  #cxq .cxa-tl { position: relative; padding: 6px 0 4px; }
  #cxq .cxa-tlbase { position: absolute; left: 8.333%; right: 8.333%; top: 80px; height: 2px; background: rgba(10,22,40,.09); }
  #cxq .cxa-link { position: absolute; top: 80px; height: 2px; width: 16.667%; transform-origin: 0 50%; }
  #cxq .cxa-nodes { position: relative; display: grid; grid-template-columns: repeat(6,1fr); align-items: start; }
  #cxq .cxa-node { display: flex; flex-direction: column; align-items: center; }
  #cxq .cxa-node .top { display: flex; flex-direction: column; align-items: center; gap: 3px; height: 58px; justify-content: flex-end; text-align: center; }
  #cxq .cxa-node .dt { font-family: 'Inter',system-ui,sans-serif; font-size: 12.5px; color: #8A94A6; }
  #cxq .cxa-node .lb { font-family: 'Inter',system-ui,sans-serif; font-weight: 600; line-height: 1.25; }
  #cxq .cxa-node .dotwrap { height: 32px; display: flex; align-items: center; justify-content: center; }
  #cxq .cxa-node .dot { border-radius: 50%; border-style: solid; border-color: #fff; }
  #cxq .cxa-node .bot { display: flex; flex-direction: column; align-items: center; gap: 7px; min-height: 62px; }
  #cxq .cxa-node .sc { font-family: 'Inter',system-ui,sans-serif; font-weight: 600; }
  #cxq .cxa-node .tag { display: inline-flex; align-items: center; text-align: center; color: #fff; border-radius: 999px; padding: 3px 11px; font-size: 11px; font-weight: 700; letter-spacing: .06em; line-height: 1.35; text-transform: uppercase; }
  #cxq .cxa-graphslot { min-height: 104px; display: flex; flex-direction: column; }
  #cxq .cxa-graph { flex: 1 1 auto; display: flex; align-items: center; gap: 20px; background: #f9fafb; border: 1px solid rgba(10,22,40,.07); border-radius: 12px; padding: 14px 18px; }
  #cxq .cxa-groups { display: flex; flex-direction: column; gap: 14px; border-top: 1px solid rgba(10,22,40,.07); padding-top: 22px; min-height: 152px; }
  #cxq .cxa-grow { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 16px; min-height: 34px; }
  #cxq .cxa-grow > span:first-child { font-family: 'Inter',system-ui,sans-serif; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  #cxq .cxa-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  #cxq .cxa-pill { display: inline-flex; align-items: center; border-radius: 999px; font-family: 'Inter',system-ui,sans-serif; white-space: nowrap; }
  #cxq .cxa-sum { display: flex; align-items: flex-start; gap: 12px; background: #FEF8FB; border: 1px solid rgba(229, 54, 163,.14); border-radius: 12px; padding: 16px 18px; min-height: 80px; }
  #cxq .cxa-sum > span:first-child { width: 3px; align-self: stretch; border-radius: 2px; background: #E536A3; flex: 0 0 auto; }
  #cxq .cxa-sum p { margin: 0; font-family: 'Inter',system-ui,sans-serif; font-size: 15px; line-height: 1.55; color: #3E4A5C; text-wrap: pretty; }
  #cxq .cxa-fadein { animation: cxaFieldIn .5s cubic-bezier(.42,0,.58,1) both; }
  @keyframes cxaZoneIn { from { opacity: 0; transform: scale(.96) } to { opacity: 1; transform: scale(1) } }
  @keyframes cxaHalo { 0% { transform: translate(-50%,-50%) scale(.96); opacity: 0 } 18% { opacity: 1 } 55% { opacity: .7 } 100% { transform: translate(-50%,-50%) scale(1.34); opacity: 0 } }
  @keyframes cxaScanSpin { from { transform: translate(-50%,-50%) rotate(0) } to { transform: translate(-50%,-50%) rotate(360deg) } }
  @keyframes cxaLive { 0%,100% { transform: scale(1); box-shadow: 0 0 0 3px rgba(34,197,94,.16) } 50% { transform: scale(1.22); box-shadow: 0 0 0 6px rgba(34,197,94,.1) } }
  @keyframes cxaFieldIn { from { opacity: 0; transform: translateY(3px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes cxaPhotoSwap { 0% { opacity: 0; transform: scale(1.07) } 100% { opacity: 1; transform: scale(1) } }
  @keyframes cxaNodeIn { from { opacity: 0; transform: scale(.96) } to { opacity: 1; transform: scale(1) } }
  @keyframes cxaLineDraw { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  @keyframes cxaPillIn { from { opacity: 0; transform: scale(.97) } to { opacity: 1; transform: scale(1) } }
  @keyframes cxaTagPop { from { opacity: 0; transform: scale(.96) } to { opacity: 1; transform: scale(1) } }
  @keyframes cxaRowIn { from { opacity: 0; transform: scale(.98) } to { opacity: 1; transform: scale(1) } }
  @keyframes cxaRingPulse {
    0%,100% { box-shadow: 0 0 0 2px rgba(239,68,68,.45), 0 0 0 9px rgba(239,68,68,.10) }
    50% { box-shadow: 0 0 0 2px rgba(239,68,68,.45), 0 0 0 15px rgba(239,68,68,.02) }
  }
  @keyframes cxqOrbPop { 0% { opacity: 0; transform: scale(.7) } 62% { opacity: 1; transform: scale(1.05) } 100% { opacity: 1; transform: scale(1) } }
  @keyframes cxqCardIn { 0% { opacity: 0; transform: translateY(22px) scale(.97) } 100% { opacity: 1; transform: translateY(0) scale(1) } }
  @keyframes cxqBeam { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.25) } 38% { opacity: .8 } 100% { opacity: 0; transform: translate(-50%,-50%) scale(2) } }
</style>
</helmet>
<div id="cxq" style="position:relative;width:1080px;height:1080px;overflow:hidden;background:transparent;font-family:'Plus Jakarta Sans',Inter,sans-serif">

  <div style="position:absolute;left:540px;top:450px;width:220px;height:220px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;background:radial-gradient(circle,rgba(229, 54, 163,.26),rgba(229, 54, 163,.10) 55%,rgba(255,255,255,0) 100%);opacity:{{ beamOpacity }};animation:cxqBeam .85s ease-out infinite"></div>

  <div ref="{{ scene0 }}" style="position:absolute;left:0;top:0;width:1080px;height:900px;display:flex;align-items:center;justify-content:center;transition:opacity 700ms cubic-bezier(.4,0,.2,1),transform 860ms cubic-bezier(.32,1.02,.4,1),filter 640ms ease;opacity:{{ s0o }};transform:scale({{ s0k }});filter:blur({{ s0b }}px)">
    <div style="zoom:1.14">
      <div style="position:relative;width:552px;height:740px;display:flex;align-items:flex-end;justify-content:flex-end">
        <div class="cxa-card" style="animation:cxqCardIn .9s cubic-bezier(.22,1,.36,1) .18s both">
          <span class="cxa-topbar" ref="{{ topbarRef }}"></span>
          <div class="cxa-head" ref="{{ headRef }}">
            <div class="cxa-headrow">
              <span class="cxa-lbl">Account</span>
              <span class="cxa-tier" ref="{{ tierRef }}"><i></i><b>Low</b></span>
            </div>
            <div class="cxa-idrow">
              <span class="cxa-tile" ref="{{ tileRef }}">
                <svg width="26" height="26" viewBox="0 0 24 24" ref="{{ tileIcRef }}" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M6 3.5A2.5 2.5 0 018.5 1h7A2.5 2.5 0 0118 3.5v17A2.5 2.5 0 0115.5 23h-7A2.5 2.5 0 016 20.5zM10 19.4h4a.9.9 0 010 1.8h-4a.9.9 0 010-1.8z"></path></svg>
              </span>
              <div class="cxa-idcol">
                <span class="cxa-id cxa-fadein" ref="{{ idRef }}" style="animation-delay:.05s">user2173</span>
                <span class="cxa-dev cxa-fadein" ref="{{ devRef }}" style="animation-delay:.12s">device</span>
              </div>
            </div>
          </div>
          <div class="cxa-fields">
            <div class="cxa-fld"><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A94A6" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.6v4.7l3.2 2"></path></svg>First seen</span><b class="cxa-fadein" ref="{{ firstRef }}" style="animation-delay:.19s">—</b></div>
            <div class="cxa-fld"><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A94A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5h17v15h-17z"></path><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Last seen</span><b class="cxa-fadein" ref="{{ lastRef }}" style="animation-delay:.25s">—</b></div>
            <div class="cxa-fld"><span><svg width="13" height="13" viewBox="0 0 24 24" fill="#8A94A6"><path d="M3 13.5h2.6V19H3zm4.7-4.8h2.6V19H7.7zm4.7-4.4H15V19h-2.6zm4.7 6.4h2.6V19h-2.6z"></path></svg>Activities</span><b class="cxa-fadein" ref="{{ actsRef }}" style="animation-delay:.31s">—</b></div>
            <div class="cxa-fld"><span><svg width="13" height="13" viewBox="0 0 24 24" fill="#8A94A6"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 1.8a7.7 7.7 0 00-7.7 7.7c0 5.7 6.7 11.8 7 12.1a1 1 0 001.4 0c.3-.3 7-6.4 7-12.1A7.7 7.7 0 0012 1.8zm0 10.2a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"></path></svg>Location</span><b class="cxa-fadein" ref="{{ cityRef }}" style="animation-delay:.37s">—</b></div>
          </div>
          <div class="cxa-foot" ref="{{ footRef }}">
            <div class="cxa-gauge">
              <svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true">
                <circle cx="52" cy="52" r="46" fill="none" stroke="#0A1628" stroke-opacity=".08" stroke-width="7"></circle>
                <circle ref="{{ ringRef }}" cx="52" cy="52" r="46" fill="none" stroke="#E536A3" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 289" transform="rotate(-90 52 52)"></circle>
              </svg>
              <div class="n" ref="{{ numRef }}"><b ref="{{ scoreIntRef }}">0</b><i>/ 100</i></div>
            </div>
            <div class="cxa-fcol">
              <span class="k">Current risk</span>
              <span class="big" ref="{{ scoreBigRef }}">0.00</span>
              <span class="cxa-segs"><span ref="{{ segsRef }}"></span><em ref="{{ sigLabelRef }}">No signals active</em></span>
            </div>
          </div>

        </div>
        <div class="cxa-orb" aria-hidden="true" style="left:0;top:8px;z-index:3;animation:cxqOrbPop .8s cubic-bezier(.34,1.5,.64,1) both">
          <span class="cxa-halo"></span>
          <span class="cxa-halo" style="animation-delay:2.5s"></span>
          <span class="cxa-halo" style="animation-delay:5s"></span>
          <span class="cxa-halo" style="animation-delay:7.5s"></span>
          <svg width="300" height="300" viewBox="0 0 300 300" style="position:absolute;inset:0;pointer-events:none">
            <defs>
              <linearGradient id="cxqArc" x1="0.15" y1="0" x2="0.85" y2="1">
                <stop offset="0%" stop-color="#E536A3" ref="{{ arc1 }}" style="transition:stop-color .7s ease"></stop>
                <stop offset="45%" stop-color="#E536A3" ref="{{ arc2 }}" style="transition:stop-color .7s ease"></stop>
                <stop offset="78%" stop-color="#E536A3" ref="{{ arc3 }}" style="transition:stop-color .7s ease"></stop>
                <stop offset="100%" stop-color="#E536A3" ref="{{ arc4 }}" style="transition:stop-color .7s ease"></stop>
              </linearGradient>
            </defs>
            <circle cx="150" cy="150" r="114" fill="none" stroke="#0A1628" stroke-opacity=".14" stroke-width="1"></circle>
            <circle cx="150" cy="150" r="99" fill="none" stroke="#0A1628" stroke-opacity=".14" stroke-width="1"></circle>
            <circle cx="150" cy="150" r="106" fill="none" stroke="url(#cxqArc)" stroke-width="4.5" stroke-opacity=".45"></circle>
          </svg>
          <span class="cxa-photo"><i ref="{{ photoRef }}"></i></span>
          <span class="cxa-scan" ref="{{ scanRef }}"></span>
        </div>
      </div>
    </div>
  </div>

  <div ref="{{ scene1 }}" style="position:absolute;left:0;top:0;width:1080px;height:900px;display:flex;align-items:center;justify-content:center;transition:opacity 700ms cubic-bezier(.4,0,.2,1),transform 860ms cubic-bezier(.32,1.02,.4,1),filter 640ms ease;opacity:{{ s1o }};transform:scale({{ s1k }});filter:blur({{ s1b }}px)">
    <div style="zoom:1.05">
      <div class="cxa-panel">
        <div class="cxa-ptop">
          <div>
            <h3>Continuous monitoring</h3>
            <p>Every session — logins, activity and transactions</p>
          </div>
          <span class="cxa-live"><i></i>Real-time</span>
        </div>
        <div class="cxa-tl">
          <div class="cxa-tlbase"></div>
          <div ref="{{ linksRef }}"></div>
          <div class="cxa-nodes" ref="{{ nodesRef }}"></div>
        </div>
        <div class="cxa-graphslot" ref="{{ graphRef }}"></div>
        <div class="cxa-groups" ref="{{ groupsRef }}"></div>
        <div class="cxa-sum"><span></span><p ref="{{ sumRef }}"></p></div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:58px;display:flex;flex-direction:column;align-items:center;gap:24px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;white-space:nowrap;transition:opacity 380ms ease;opacity:{{ capOpacity }}">
      <b style="font-size:30px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#0A1628">{{ capTitle }}</b>
      <i style="font-style:normal;font-family:Inter,sans-serif;font-size:26px;color:#6B7688">{{ capSub }}</i>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="height:6px;border-radius:3px;transition:width 460ms ease,background 460ms ease;width:{{ p0w }}px;background:{{ p0c }}"></span>
      <span style="height:6px;border-radius:3px;transition:width 460ms ease,background 460ms ease;width:{{ p1w }}px;background:{{ p1c }}"></span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1080},&quot;cardSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4.2,&quot;min&quot;:2.5,&quot;max&quot;:9,&quot;step&quot;:0.2,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Timing&quot;}}">
const LOW = '#E536A3', LOW2 = '#E536A3';
const EASE = 'cubic-bezier(.42,0,.58,1)';
const TONES = {
  cyan:   { dot: LOW,       text: '#E536A3', label: '#0A1628', rgb: '8,145,178',  size: '14px', ring: '3px',   score: '16px' },
  amber:  { dot: '#F59E0B', text: '#B45309', label: '#B45309', rgb: '245,158,11', size: '18px', ring: '3px',   score: '17px' },
  orange: { dot: '#EA580C', text: '#C2410C', label: '#C2410C', rgb: '234,88,12',  size: '21px', ring: '3.5px', score: '18px' },
  red:    { dot: '#EF4444', text: '#EF4444', label: '#0A1628', rgb: '239,68,68',  size: '26px', ring: '4px',   score: '20px' }
};
const PILL = {
