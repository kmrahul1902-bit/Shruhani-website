          <svg width="46" height="46" viewBox="0 0 24 24" fill="#22C55E" style="animation:s3-badge-pop .62s cubic-bezier(.34,1.56,.64,1) both,s3-badge-dance 3.4s ease-in-out .62s infinite"><path d="M12 2.4a1 1 0 00-.4.1L4.5 5.3a1 1 0 00-.6.9v5.4c0 5.1 3.4 9.4 8.1 11.1a1 1 0 00.7 0c4.7-1.7 8.1-6 8.1-11.1V6.2a1 1 0 00-.6-.9L12.4 2.5a1 1 0 00-.4-.1z"></path><path d="M8.4 11.6l2.4 2.5 4.5-4.7 1.5 1.5-6 6.2-3.9-4z" fill="#fff"></path></svg>
          <span style="font-family:Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#22C55E;animation:s3-badge-rise .5s ease-out .2s both">Low Risk</span>
          <span style="font-size:38px;font-weight:800;letter-spacing:.02em;color:#22C55E;line-height:1;animation:s3-badge-rise .5s ease-out .3s both">APPROVE</span>
          <span style="font-family:Inter,sans-serif;font-size:13px;color:#6B7688;animation:s3-badge-rise .5s ease-out .42s both">Fast Decision</span>
        </div>
        <div ref="{{ freezeRef }}" style="display:none;flex-direction:column;align-items:center;gap:10px">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="#D93A22" style="animation:s3-badge-pop .62s cubic-bezier(.34,1.56,.64,1) both,s3-badge-dance 3.4s ease-in-out .62s infinite"><path d="M12 2.4a1 1 0 00-.4.1L4.5 5.3a1 1 0 00-.6.9v5.4c0 5.1 3.4 9.4 8.1 11.1a1 1 0 00.7 0c4.7-1.7 8.1-6 8.1-11.1V6.2a1 1 0 00-.6-.9L12.4 2.5a1 1 0 00-.4-.1z"></path><path d="M9.6 9.2V8.1a2.4 2.4 0 014.8 0v1.1h.6c.5 0 .9.4.9.9v4.3c0 .5-.4.9-.9.9H9c-.5 0-.9-.4-.9-.9v-4.3c0-.5.4-.9.9-.9zm1.5 0h1.8V8.1a.9.9 0 00-1.8 0z" fill="#fff"></path></svg>
          <span style="font-family:Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#D93A22;animation:s3-badge-rise .5s ease-out .2s both">High Risk</span>
          <span style="font-size:38px;font-weight:800;letter-spacing:.02em;color:#D93A22;line-height:1;animation:s3-badge-rise .5s ease-out .3s both">FREEZE</span>
          <span style="font-family:Inter,sans-serif;font-size:13px;color:#6B7688;text-align:center;line-height:1.35;animation:s3-badge-rise .5s ease-out .42s both">Hold until further analysis</span>
        </div>

    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:64px;display:flex;flex-direction:column;align-items:center;gap:26px">
    <div ref="{{ capRef }}" style="display:flex;flex-direction:column;align-items:center;gap:12px;transition:opacity 380ms ease;opacity:{{ capOpacity }}">
      <b style="font-size:30px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#0A1628">{{ capTitle }}</b>
      <i style="font-style:normal;font-family:Inter,sans-serif;font-size:26px;color:#6B7688">{{ capSub }}</i>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="height:6px;border-radius:3px;transition:width 460ms ease,background 460ms ease;width:{{ p0w }}px;background:{{ p0c }}"></span>
      <span style="height:6px;border-radius:3px;transition:width 460ms ease,background 460ms ease;width:{{ p1w }}px;background:{{ p1c }}"></span>
      <span style="height:6px;border-radius:3px;transition:width 460ms ease,background 460ms ease;width:{{ p2w }}px;background:{{ p2c }}"></span>
    </div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1080},&quot;sceneSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4.4,&quot;min&quot;:2.5,&quot;max&quot;:9,&quot;step&quot;:0.2,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Timing&quot;},&quot;scenario&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Alternate&quot;,&quot;Low risk&quot;,&quot;High risk&quot;],&quot;default&quot;:&quot;Alternate&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Decision&quot;}}">
const FACES = ['https://cdn.sign3.in/strapi-assets/api-uploads/hero_face_illus_1_b0c2c3cae7.png', 'https://cdn.sign3.in/strapi-assets/api-uploads/hero_face_illus_2_be207e0c1f.png'];
const CAPS = [
  ['Identity Signals', 'Six sources, one profile'],
  ['Signal Fusion', 'Real-time signal fusion'],
  ['Decision', 'Under 300 ms']
];

class Component extends DCLogic {
  state = { scene: 0, moving: false, decided: false, round: 0 };

  constructor(props) {
    super(props);
    ['rootRef', 'scene0', 'scene1', 'scene2', 'canvasRef', 'profileRef', 'analyseRef', 'approveRef', 'freezeRef', 'ringOkRef', 'ringRiskRef', 'capRef']
      .forEach(k => { this[k] = React.createRef(); });
    this.last = 0;
  }

  componentDidMount() {
    this.t0 = performance.now();
    this.drawMesh(0);
    this.raf = requestAnimationFrame(this.loop);
    this.tick(0);
  }

  componentWillUnmount() { cancelAnimationFrame(this.raf); }

  loop = ts => {
    this.raf = requestAnimationFrame(this.loop);
    if (ts - this.last < 22) return;
    this.last = ts;
    this.drawMesh(ts / 1000);
    this.tick(Math.max(0, ts - this.t0));
  };

  // single authored clock — self-healing, never gets stuck mid-transition
  get plan() {
    const hold = (this.props.sceneSeconds == null ? 4.4 : this.props.sceneSeconds) * 1000;
    const T = 900;
    return { segs: [hold + T, hold + T, hold + 2600 + T], T: T };
  }

  tick(ms) {
    const p = this.plan, cycle = p.segs[0] + p.segs[1] + p.segs[2];
    const round = Math.floor(ms / cycle) % 2;
    let t = ms % cycle, scene = 0;
    for (let i = 0; i < 3; i++) {
      if (t < p.segs[i]) { scene = i; break; }
      t -= p.segs[i];
    }
    const moving = t > p.segs[scene] - p.T;
    const decided = scene === 2 && t > 2400;
    const s = this.state;
    if (scene !== s.scene || moving !== s.moving || decided !== s.decided || round !== s.round) {
      this.setState({ scene: scene, moving: moving, decided: decided, round: round });
      if (scene !== s.scene && !moving) {
        this.applyFace();
        setTimeout(() => this.replay(scene), 30);
      }
      if (scene === 2) this.showStage(decided ? 'verdict' : 'analyse');
    }
  }

  get risk() {
    const mode = this.props.scenario || 'Alternate';
    if (mode === 'Low risk') return false;
    if (mode === 'High risk') return true;
    return this.state.round === 1;
  }

  applyFace() {
    const el = this.profileRef.current;
    if (el) {
      el.style.background = "#FFFFFF url('" + FACES[this.state.round] + "') 50% 50%/106% no-repeat";
    }
  }

  showStage(which) {
    const set = (ref, on) => { if (ref.current) ref.current.style.display = on ? 'flex' : 'none'; };
    const risk = this.risk;
    if (which === 'analyse') {
      set(this.analyseRef, true); set(this.approveRef, false); set(this.freezeRef, false);
      if (this.ringOkRef.current) this.ringOkRef.current.style.display = 'block';
      if (this.ringRiskRef.current) this.ringRiskRef.current.style.display = 'none';
    } else {
      set(this.analyseRef, false);
      set(this.approveRef, !risk); set(this.freezeRef, risk);
      if (this.ringOkRef.current) this.ringOkRef.current.style.display = risk ? 'none' : 'block';
      if (this.ringRiskRef.current) this.ringRiskRef.current.style.display = risk ? 'block' : 'none';
    }
  }

  replay(i) {
    const root = [this.scene0, this.scene1, this.scene2][i].current;
    if (!root || !root.querySelectorAll) return;
    const names = { 's3-in-pop': 1, 's3-in-pop-c': 1, 's3-chip-pop': 1, 's3-in-fade': 1, 's3-stage-pop': 1, 's3-badge-pop': 1, 's3-badge-rise': 1 };
    root.querySelectorAll('*').forEach(e => {
      if (!e.getAnimations) return;
      e.getAnimations().forEach(a => { if (a.animationName && names[a.animationName]) { a.cancel(); a.play(); } });
    });
  }

  buildMesh() {
    const N = 420, gold = Math.PI * (3 - Math.sqrt(5)), base = [];
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2, r0 = Math.sqrt(Math.max(0, 1 - y * y)), t = gold * i;
      base.push([Math.cos(t) * r0, y, Math.sin(t) * r0]);
    }
    const links = [], lim = 0.24;
    for (let a = 0; a < N; a++) for (let b = a + 1; b < N; b++) {
      const dx = base[a][0] - base[b][0], dy = base[a][1] - base[b][1], dz = base[a][2] - base[b][2];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d < lim) links.push([a, b, 1 - d / lim]);
    }
    this.mesh = { base: base, links: links };
  }

  drawMesh(t) {
    const cv = this.canvasRef.current;
    if (!cv) return;
    if (!this.mesh) this.buildMesh();
    const mesh = this.mesh;
    const ctx = cv.getContext('2d'), S = cv.width, C = S / 2, R = S * 0.455;
    ctx.clearRect(0, 0, S, S);
    const ry = 0.6 + t * 0.34, rx = -0.28 + Math.sin(t * 0.55) * 0.12;
    const cry = Math.cos(ry), sry = Math.sin(ry), crx = Math.cos(rx), srx = Math.sin(rx);
    const pts = [];
    for (let i = 0; i < mesh.base.length; i++) {
      const x = mesh.base[i][0], y = mesh.base[i][1], z = mesh.base[i][2];
      const x1 = x * cry + z * sry;
      let z1 = -x * sry + z * cry;
      const y1 = y * crx - z1 * srx;
      z1 = y * srx + z1 * crx;
      const pp = 1 / (1.9 - z1 * 0.42);
      pts.push({ sx: C + x1 * R * pp * 1.9, sy: C + y1 * R * pp * 1.9, z: z1 });
    }
    ctx.lineWidth = 0.8;
    for (let k = 0; k < mesh.links.length; k++) {
      const pa = pts[mesh.links[k][0]], pb = pts[mesh.links[k][1]], w = mesh.links[k][2];
      const depth = (pa.z + pb.z) / 2, alpha = w * (depth > 0 ? 0.34 : 0.14);
      if (alpha < 0.02) continue;
      const hm = 0.5 + 0.5 * Math.sin(t * 0.4 + pa.sx * 0.006);
      ctx.strokeStyle = 'rgba(' + Math.round(29 + hm * 60) + ',' + Math.round(78 - hm * 20) + ',' + Math.round(216 + hm * 20) + ',' + alpha.toFixed(3) + ')';
      ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
    }
    for (let j = 0; j < pts.length; j++) {
      const p = pts[j], front = p.z > 0;
      ctx.fillStyle = front ? 'rgba(194, 30, 134,0.62)' : 'rgba(244, 95, 184,0.32)';
      ctx.beginPath(); ctx.arc(p.sx, p.sy, front ? 2.1 : 1.5, 0, Math.PI * 2); ctx.fill();
    }
    const ang = t * 0.25;
    const wash = ctx.createLinearGradient(C + Math.cos(ang) * R, C + Math.sin(ang) * R, C - Math.cos(ang) * R, C - Math.sin(ang) * R);
    wash.addColorStop(0, 'rgba(124,92,224,0.16)'); wash.addColorStop(0.5, 'rgba(194, 30, 134,0.06)'); wash.addColorStop(1, 'rgba(229, 54, 163,0.16)');
    ctx.fillStyle = wash; ctx.fillRect(0, 0, S, S);
    const rim = ctx.createRadialGradient(C, C, R * 0.72, C, C, R * 1.16);
    rim.addColorStop(0, 'rgba(244, 95, 184,0)'); rim.addColorStop(0.55, 'rgba(244, 95, 184,0.16)'); rim.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rim; ctx.fillRect(0, 0, S, S);
    const cw = 0.86 + 0.05 * Math.sin(t * 0.5);
    const core = ctx.createRadialGradient(C, C, 0, C, C, R * 0.74);
    core.addColorStop(0, 'rgba(255,255,255,0.97)'); core.addColorStop(0.62, 'rgba(255,255,255,' + cw.toFixed(2) + ')'); core.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = core; ctx.fillRect(0, 0, S, S);
  }

  layer(i) {
    const s = this.state;
    if (s.moving) return { o: 0, k: i === s.scene ? 1.14 : 0.9, b: 9 };
    if (i === s.scene) return { o: 1, k: 1, b: 0 };
    return { o: 0, k: 0.86, b: 6 };
  }

  renderVals() {
    const a = this.layer(0), b = this.layer(1), c = this.layer(2);
    const sc = this.state.scene;
    const bar = i => ({ w: i === sc ? 84 : 26, c: i === sc ? '#C21E86' : 'rgba(10,22,40,0.16)' });
    const b0 = bar(0), b1 = bar(1), b2 = bar(2);
    return {
      rootRef: this.rootRef, scene0: this.scene0, scene1: this.scene1, scene2: this.scene2,
      canvasRef: this.canvasRef, profileRef: this.profileRef, capRef: this.capRef,
      analyseRef: this.analyseRef, approveRef: this.approveRef, freezeRef: this.freezeRef,
      ringOkRef: this.ringOkRef, ringRiskRef: this.ringRiskRef,
      s0o: a.o, s0k: a.k, s0b: a.b,
      s1o: b.o, s1k: b.k, s1b: b.b,
      s2o: c.o, s2k: c.k, s2b: c.b,
      beamOpacity: this.state.moving ? 1 : 0,
      capTitle: CAPS[sc][0], capSub: CAPS[sc][1],
      capOpacity: this.state.moving ? 0 : 1,
      p0w: b0.w, p0c: b0.c, p1w: b1.w, p1c: b1.c, p2w: b2.w, p2c: b2.c
    };
  }
}

</script>

<style>

  body { width: 100%; margin: 0; overflow: hidden; }

  /* The artboard's own width. Its children are positioned in a 1080 space but
     the root only inherits the body's, so without this the scale below shrinks
     a 100%-wide box and the composition lands at a third of its width. The
     scale itself is set by the script, not here. */
  body > *:not(style):not(script):not(link) {
    width: 1080px;
    transform-origin: top left;
    /* The scale is a plain number in a custom property, set by the script. A
       RULE rather than an inline style, because the Design Component runtime
       replaces this element after it renders — an inline style set before that
       is simply gone, while a rule applies to whatever the root becomes. */
    transform: scale(var(--sq-scale, 1));
  }
</style>

<script>
  // Added by scripts/sync-hero-animations.mjs — not from the design bundle.
  //
  // Fits the artboard to the frame. These four are the one family that does not
  // fit itself: each is a fixed 1080 x 1080 composition, and the handoff scales
  // it from the page ("340 x 340, scale 0.31481"). Every other animation we
  // serve fits itself to its host, and useAnimationFrameHeight relies on that.
  //
  // In JS rather than CSS, and the reason is the second line below. The scale
  // alone can be written in CSS as scale(calc(100vw / 1080px)) — but that is a
  // length divided by a length, which is CSS Values 4 and not something to
  // depend on across engines: where it is not supported the declaration is
  // dropped silently and the artboard renders at its full 1080, which is
  // exactly "the animation is too tall and there is white space after it".
  //
  // The height matters more. A transform does not participate in layout, so
  // whatever the scale, the document still RESERVES the artboard's untransformed
  // 1080px. Chromium happens to give the right answer because the frame is sized
  // from painted rects rather than the document, but that is the measurement
  // getting lucky, not the layout being right. Setting the body's height to what
  // the artwork actually paints makes the document honest in every engine, and
  // leaves nothing for the frame to over-reserve.
  (function () {
    var ARTBOARD = 1080;
    function fit() {
      var width = document.documentElement.clientWidth;
      if (!width) return;
      var scale = width / ARTBOARD;
      // On the document element, so it survives the root being re-rendered.
      document.documentElement.style.setProperty("--sq-scale", scale);
      document.body.style.height = Math.round(ARTBOARD * scale) + "px";
    }

    fit();
    addEventListener("resize", fit);
    addEventListener("load", fit);
  })();
</script>
