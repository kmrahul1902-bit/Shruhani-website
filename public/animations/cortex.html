<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hero animation — Continuous monitoring (Cortex)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FEF8FB;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;color:#0A1628;overflow-x:hidden}
  .stage{padding:64px 0 96px;display:flex;flex-direction:column;align-items:center}
  .stage>.cap{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8A94A6;margin-bottom:40px}

<body>
<div class="stage">
  <span class="cap">Cortex hero · post-approval monitoring timeline</span>
<!-- RIGHT: continuous-monitoring animation -->
      <style>
      #cxaHost { width: 100%; display: flex; justify-content: center; overflow: visible; }
      #cxaRow {
        width: 100%; max-width: 1620px; zoom: 0.7; box-sizing: border-box;
        padding: 150px 0 0 96px; position: relative; text-align: left;
        display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: clamp(48px,6vw,120px);
      }
      #cxaRow .cxa-lz { flex: 0 1 auto; width: 440px; max-width: 100%; position: relative; z-index: 1; animation: cxaZoneIn 1.5s cubic-bezier(.42,0,.58,1) both; }
      #cxaRow .cxa-card {
        width: 100%; min-height: 566px; position: relative; background: #fff;
        border: 1px solid rgba(10,22,40,.08); border-radius: 12px; box-shadow: 0 22px 52px rgba(10,22,40,.09);
        box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      #cxaRow .cxa-topbar { position: absolute; left: 0; right: 0; top: 0; height: 3px; }
      #cxaRow .cxa-head { padding: 64px 30px 22px; display: flex; flex-direction: column; gap: 20px; }
      #cxaRow .cxa-headrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-left: 104px; }
      #cxaRow .cxa-lbl { font-family: 'Inter',system-ui,sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #8A94A6; }
      #cxaRow .cxa-tier { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 5px 13px; font-size: 12px; font-weight: 700; }
      #cxaRow .cxa-tier i { width: 6px; height: 6px; border-radius: 50%; }
      #cxaRow .cxa-idrow { display: flex; align-items: center; gap: 16px; }
      #cxaRow .cxa-tile { position: relative; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 14px; }
      #cxaRow .cxa-idcol { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
      #cxaRow .cxa-id { font-size: 29px; font-weight: 800; letter-spacing: -.015em; color: #0A1628; line-height: 1.05; }
      #cxaRow .cxa-dev { font-family: 'Inter',system-ui,sans-serif; font-size: 13.5px; color: #6B7688; }
      #cxaRow .cxa-fields { padding: 0 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      #cxaRow .cxa-fld { display: flex; flex-direction: column; gap: 5px; background: #f9fafb; border: 1px solid rgba(10,22,40,.07); border-radius: 10px; padding: 13px 14px; }
      #cxaRow .cxa-fld > span:first-child { display: flex; align-items: center; gap: 6px; font-family: 'Inter',system-ui,sans-serif; font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: #8A94A6; }
      #cxaRow .cxa-fld b { font-family: 'Inter',system-ui,sans-serif; font-size: 17px; font-weight: 600; color: #0A1628; }
      #cxaRow .cxa-foot { margin: 24px 0 0; padding: 24px 30px 28px; border-top: 1px solid rgba(10,22,40,.07); display: flex; align-items: center; gap: 22px; }
      #cxaRow .cxa-gauge { position: relative; width: 104px; height: 104px; flex: 0 0 auto; }
      #cxaRow .cxa-gauge .n { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: 'Inter',system-ui,sans-serif; }
      #cxaRow .cxa-gauge .n b { font-size: 26px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
      #cxaRow .cxa-gauge .n i { font-size: 11px; font-weight: 500; opacity: .65; font-style: normal; }
      #cxaRow .cxa-fcol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      #cxaRow .cxa-fcol .k { font-family: 'Inter',system-ui,sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #8A94A6; }
      #cxaRow .cxa-fcol .big { font-family: 'Inter',system-ui,sans-serif; font-size: 46px; font-weight: 600; line-height: 1; letter-spacing: -.025em; }

      #cxaRow .cxa-segs i { width: 4px; height: 11px; border-radius: 2px; transition: background .5s ease; }
      #cxaRow .cxa-segs em { font-family: 'Inter',system-ui,sans-serif; font-size: 13.5px; color: #6B7688; font-style: normal; }

      #cxaRow .cxa-orb { position: absolute; left: -112px; top: -166px; width: 300px; height: 300px; }
      #cxaRow .cxa-halo { position: absolute; left: 50%; top: 50%; width: 216px; height: 216px; border-radius: 50%; border: 1.5px solid rgba(229, 54, 163,.28); opacity: 0; transform: translate(-50%,-50%); animation: cxaHalo 10s cubic-bezier(.42,0,.58,1) infinite; }
      #cxaRow .cxa-photo { position: absolute; left: 150px; top: 150px; transform: translate(-50%,-50%); width: 126px; height: 126px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 12px 32px rgba(10,22,40,.14); background: #eef1f5; overflow: hidden; }
      #cxaRow .cxa-photo i { position: absolute; inset: 0; border-radius: 50%; background-size: cover; background-repeat: no-repeat; }
      #cxaRow .cxa-scan { position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; border-radius: 50%; pointer-events: none; transform: translate(-50%,-50%); transition: background .7s ease; -webkit-mask: radial-gradient(circle at center,transparent 0 63px,#000 63.5px); mask: radial-gradient(circle at center,transparent 0 63px,#000 63.5px); animation: cxaScanSpin 7s linear .5s infinite; }

      #cxaRow .cxa-panel {
        position: relative; z-index: 1; flex: 0 1 auto; width: 940px; max-width: 100%; min-height: 724px;
        background: #fff; border: 1px solid rgba(10,22,40,.08); border-radius: 12px; box-shadow: 0 22px 52px rgba(10,22,40,.09);
        padding: 28px 34px 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 26px;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        animation: cxaZoneIn 1.5s cubic-bezier(.42,0,.58,1) .12s both;
      }
      #cxaRow .cxa-ptop { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
      #cxaRow .cxa-ptop h3 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; color: #0A1628; }
      #cxaRow .cxa-ptop p { margin: 5px 0 0; font-family: 'Inter',system-ui,sans-serif; font-size: 14px; color: #6B7688; }
      #cxaRow .cxa-live { display: inline-flex; align-items: center; gap: 8px; background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.24); border-radius: 999px; padding: 6px 13px; flex: 0 0 auto; white-space: nowrap; font-family: 'Inter',system-ui,sans-serif; font-size: 12px; font-weight: 600; color: #16A34A; }
      #cxaRow .cxa-live i { width: 8px; height: 8px; border-radius: 50%; background: #22C55E; box-shadow: 0 0 0 3px rgba(34,197,94,.16); animation: cxaLive 2.6s cubic-bezier(.42,0,.58,1) infinite; }
      #cxaRow .cxa-tl { position: relative; padding: 6px 0 4px; }
      #cxaRow .cxa-tlbase { position: absolute; left: 8.333%; right: 8.333%; top: 80px; height: 2px; background: rgba(10,22,40,.09); }
      #cxaRow .cxa-link { position: absolute; top: 80px; height: 2px; width: 16.667%; transform-origin: 0 50%; }
      #cxaRow .cxa-nodes { position: relative; display: grid; grid-template-columns: repeat(6,1fr); align-items: start; }
      #cxaRow .cxa-node { display: flex; flex-direction: column; align-items: center; }
      #cxaRow .cxa-node .top { display: flex; flex-direction: column; align-items: center; gap: 3px; height: 58px; justify-content: flex-end; text-align: center; }
      #cxaRow .cxa-node .dt { font-family: 'Inter',system-ui,sans-serif; font-size: 12.5px; color: #8A94A6; }
      #cxaRow .cxa-node .lb { font-family: 'Inter',system-ui,sans-serif; font-weight: 600; line-height: 1.25; }
      #cxaRow .cxa-node .dotwrap { height: 32px; display: flex; align-items: center; justify-content: center; }
      #cxaRow .cxa-node .dot { border-radius: 50%; border-style: solid; border-color: #fff; }
      #cxaRow .cxa-node .bot { display: flex; flex-direction: column; align-items: center; gap: 7px; min-height: 62px; }
      #cxaRow .cxa-node .sc { font-family: 'Inter',system-ui,sans-serif; font-weight: 600; }
      #cxaRow .cxa-node .tag { display: inline-flex; align-items: center; text-align: center; color: #fff; border-radius: 999px; padding: 3px 11px; font-size: 11px; font-weight: 700; letter-spacing: .06em; line-height: 1.35; text-transform: uppercase; }
      #cxaRow .cxa-graphslot { min-height: 104px; display: flex; flex-direction: column; }
      #cxaRow .cxa-graph { flex: 1 1 auto; display: flex; align-items: center; gap: 20px; background: #f9fafb; border: 1px solid rgba(10,22,40,.07); border-radius: 12px; padding: 14px 18px; }
      #cxaRow .cxa-groups { display: flex; flex-direction: column; gap: 14px; border-top: 1px solid rgba(10,22,40,.07); padding-top: 22px; min-height: 152px; box-sizing: border-box; }
      #cxaRow .cxa-grow { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 16px; min-height: 34px; }
      #cxaRow .cxa-grow > span:first-child { font-family: 'Inter',system-ui,sans-serif; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
      #cxaRow .cxa-pills { display: flex; flex-wrap: wrap; gap: 8px; }
      #cxaRow .cxa-pill { display: inline-flex; align-items: center; border-radius: 999px; font-family: 'Inter',system-ui,sans-serif; }
      #cxaRow .cxa-sum { display: flex; align-items: flex-start; gap: 12px; background: #FEF8FB; border: 1px solid rgba(229, 54, 163,.14); border-radius: 12px; padding: 16px 18px; min-height: 80px; box-sizing: border-box; }
      #cxaRow .cxa-sum > span:first-child { width: 3px; align-self: stretch; border-radius: 2px; background: #E536A3; flex: 0 0 auto; }
      #cxaRow .cxa-sum p { margin: 0; font-family: 'Inter',system-ui,sans-serif; font-size: 15px; line-height: 1.55; color: #3E4A5C; text-wrap: pretty; }

      @keyframes cxaZoneIn { from { opacity: 0; transform: scale(.96) } to { opacity: 1; transform: scale(1) } }
      @keyframes cxaHalo { 0% { transform: translate(-50%,-50%) scale(.96); opacity: 0 } 18% { opacity: 1 } 55% { opacity: .7 } 100% { transform: translate(-50%,-50%) scale(1.34); opacity: 0 } }
      @keyframes cxaScanSpin { from { transform: translate(-50%,-50%) rotate(0) } to { transform: translate(-50%,-50%) rotate(360deg) } }
      @keyframes cxaLive { 0%,100% { transform: scale(1); box-shadow: 0 0 0 3px rgba(34,197,94,.16) } 50% { transform: scale(1.22); box-shadow: 0 0 0 6px rgba(34,197,94,.1) } }
      @keyframes cxaFieldIn { from { opacity: 0; transform: translateY(3px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes cxaPhotoSwap { 0% { opacity: 0; transform: scale(1.07) } 100% { opacity: 1; transform: scale(1) } }
      @keyframes cxaNodeIn { from { opacity: 0; transform: scale(.96) } to { opacity: 1; transform: scale(1) } }
      @keyframes cxaLineDraw { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      @keyframes cxaPillIn { from { opacity: 0; transform: scale(.97) } to { opacity: 1; transform: scale(1) } }
      @keyframes cxaTagPop { from { opacity: 0; transform: scale(.96) } to { opacity: 1; transform: scale(1) } }
      @keyframes cxaRowIn { from { opacity: 0; transform: scale(.98) } to { opacity: 1; transform: scale(1) } }
      @keyframes cxaRingPulse {
        0%,100% { box-shadow: 0 0 0 2px rgba(239,68,68,.45), 0 0 0 9px rgba(239,68,68,.10) }
        50% { box-shadow: 0 0 0 2px rgba(239,68,68,.45), 0 0 0 15px rgba(239,68,68,.02) }
      }
      #cxaRow .cxa-fadein { animation: cxaFieldIn .5s cubic-bezier(.42,0,.58,1) both; }
      @media (max-width: 1180px) { #cxaRow { zoom: .56; padding-left: 40px; } }
      @media (prefers-reduced-motion: reduce) {
        #cxaHost * { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
      </style>

      <div id="cxaHost">
        <div id="cxaRow">
          <div class="cxa-lz">
            <div class="cxa-card" data-node="card">
              <span class="cxa-topbar" id="cxaTopbar"></span>
              <div class="cxa-head" id="cxaHead">
                <div class="cxa-headrow">
                  <span class="cxa-lbl">Account</span>
                  <span class="cxa-tier" id="cxaTier"><i></i><b>Low</b></span>
                </div>
                <div class="cxa-idrow">
                  <span class="cxa-tile" id="cxaTile">
                    <svg width="26" height="26" viewBox="0 0 24 24" id="cxaTileIc" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M6 3.5A2.5 2.5 0 018.5 1h7A2.5 2.5 0 0118 3.5v17A2.5 2.5 0 0115.5 23h-7A2.5 2.5 0 016 20.5zM10 19.4h4a.9.9 0 010 1.8h-4a.9.9 0 010-1.8z"></path></svg>
                  </span>

                    <span class="cxa-id cxa-fadein" id="cxaId" style="animation-delay:.05s">user2173</span>

              </div>
              <div class="cxa-fields">
                <div class="cxa-fld"><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A94A6" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.6v4.7l3.2 2"></path></svg>First seen</span><b class="cxa-fadein" id="cxaFirst" style="animation-delay:.19s">—</b></div>
                <div class="cxa-fld"><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A94A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5h17v15h-17z"></path><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Last seen</span><b class="cxa-fadein" id="cxaLast" style="animation-delay:.25s">—</b></div>
                <div class="cxa-fld"><span><svg width="13" height="13" viewBox="0 0 24 24" fill="#8A94A6"><path d="M3 13.5h2.6V19H3zm4.7-4.8h2.6V19H7.7zm4.7-4.4H15V19h-2.6zm4.7 6.4h2.6V19h-2.6z"></path></svg>Activities</span><b class="cxa-fadein" id="cxaActs" style="animation-delay:.31s">—</b></div>
                <div class="cxa-fld"><span><svg width="13" height="13" viewBox="0 0 24 24" fill="#8A94A6"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 1.8a7.7 7.7 0 00-7.7 7.7c0 5.7 6.7 11.8 7 12.1a1 1 0 001.4 0c.3-.3 7-6.4 7-12.1A7.7 7.7 0 0012 1.8zm0 10.2a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"></path></svg>Location</span><b class="cxa-fadein" id="cxaCity" style="animation-delay:.37s">—</b></div>
              </div>
              <div class="cxa-foot" id="cxaFootWash">
                <div class="cxa-gauge">
                  <svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true">
                    <circle cx="52" cy="52" r="46" fill="none" stroke="#0A1628" stroke-opacity=".08" stroke-width="7"></circle>
                    <circle id="cxaRing" cx="52" cy="52" r="46" fill="none" stroke="#E536A3" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 289" transform="rotate(-90 52 52)"></circle>
                  </svg>
                  <div class="n"><b id="cxaScoreInt">0</b><i>/ 100</i></div>
                </div>
                <div class="cxa-fcol">
                  <span class="k">Current risk</span>
                  <span class="big" id="cxaScoreBig">0.00</span>

              <span class="cxa-halo"></span>

                  </linearGradient>
                </defs>
                <circle cx="150" cy="150" r="114" fill="none" stroke="#0A1628" stroke-opacity=".14" stroke-width="1"></circle>

          muted: { bg: 'rgba(10,22,40,.04)',   border: 'rgba(10,22,40,.10)',   color: '#6B7688', pad: '5px 12px', size: '13px', weight: '500' }
        };
        var GRAPH = '<svg width="300" height="76" viewBox="0 0 300 76" aria-hidden="true" style="flex:0 0 auto">' +
          '<defs><radialGradient id="cxaHubGlow" cx=".5" cy=".5" r=".5"><stop offset="0%" stop-color="#EA580C" stop-opacity=".15"></stop><stop offset="100%" stop-color="#EA580C" stop-opacity="0"></stop></radialGradient></defs>' +
          '<circle cx="34" cy="38" r="36" fill="url(#cxaHubGlow)"></circle>' +
          '<g fill="none" stroke="#EA580C" stroke-opacity=".42" stroke-width="1.4"><path d="M52 38 C 82 38, 86 10, 116 10"></path><path d="M52 38 C 82 38, 86 29, 116 29"></path><path d="M52 38 C 82 38, 86 47, 116 47"></path><path d="M52 38 C 82 38, 86 66, 116 66"></path></g>' +

  //                          exactly the host's width, with no percentage under
  //                          zoom for engines to disagree about
  //   transform: scale(s)    spec'd identically in every engine, and does not
  //                          participate in layout, which is what makes the
  //                          percentage above safe
  //   flex: none             the hosts are centring flex containers, so a flex
  //                          item would be SHRUNK back to the host's width — the
  //                          very thing the calc() exists to avoid
  //   transform-origin: top center
  //                          the host centres the layout box, so scaling about
  //                          its own centre keeps the painted result centred even
  //                          where a max-width caps it narrower than the host
  //
  // Geometry is preserved rather than approximated: under 'zoom: s' with
  // 'width: 100%' the row's offsetWidth is already host/s and its rect is host,
  // which is exactly what the pair above produces — so the controllers, which
  // divide by rect.width / offsetWidth to undo the scaling, read identical
  // numbers before and after.
  (function () {
    // Re-scanned on every pass rather than collected once. The Design Component
    // runtime behind the mobile heroes renders after this script parses and
    // replaces what was there, so a list captured at parse time misses whatever
    // it creates — cortex-mobile ships two inline zooms that only exist after
    // it has run. Converting is idempotent: a converted element carries an
    // inline zoom of 1, so a later pass no longer sees it.
    function collect() {
      var scaled = [];
      document.querySelectorAll("body *").forEach(function (el) {
        var z = parseFloat(getComputedStyle(el).zoom);
        if (!(z > 0) || z === 1) return;
      // Take only the element the zoom is DECLARED on, never its descendants.
      // Engines disagree about what computed zoom reports: Chrome gives the
      // element's own value, and a descendant of a zoomed row reads 1; other
      // engines report the cumulative zoom, so every descendant reads the row's
      // value too. Without this guard the second kind of engine would scale the
      // whole subtree again, once per level -- geometry inside the row would
      // collapse in exactly the way a distorted, off-centre composition looks.
      // A declared zoom always differs from its parent's; an inherited reading
      // never does.
        var parent = el.parentElement;
        var pz = parent ? parseFloat(getComputedStyle(parent).zoom) : 1;
        if (pz > 0 && Math.abs(pz - z) < 0.0001) return;
        scaled.push(el);
      });
      return scaled;
    }

    var OURS = [
      "zoom",
      "width",
      "flex",
      "transform",
      "transform-origin",
      "margin-bottom",
    ];

    function apply(el) {
      // Drop back to the stylesheet's own state first: the scale is
      // breakpoint-dependent (screenx 0.72 -> 0.6, cortex 0.7 -> 0.56) and an
      // inline zoom of our own would mask the media query's value.
      OURS.forEach(function (p) {
        el.style.removeProperty(p);
      });
      var s = parseFloat(getComputedStyle(el).zoom);
      if (!(s > 0) || s === 1) return; // Unscaled at this width.

      el.style.setProperty("zoom", "1", "important");
      el.style.setProperty("width", "calc(100% / " + s + ")", "important");
      el.style.setProperty("flex", "none", "important");
      el.style.setProperty("transform-origin", "top center", "important");
      el.style.setProperty("transform", "scale(" + s + ")", "important");

      // The transform paints smaller but the row still RESERVES its full
      // unscaled height, so take back exactly the part that no longer paints.
      //
      // offsetHeight, NOT getBoundingClientRect().height, even though the rect
      // is the painted box and looks like the more direct answer: the rect fed
      // back on itself when this was last built — a too-tall row lengthens the
      // page, which brings in a scrollbar, which narrows the viewport, which
      // re-wraps the row, which makes it taller again. In WebKit at 1024px that
      // ran away to 6052px. The layout height cannot be influenced by what we
      // set here, so there is nothing for a loop to amplify.
      var dead = Math.round(el.offsetHeight * (1 - s));
      if (dead > 0)
        el.style.setProperty("margin-bottom", "-" + dead + "px", "important");
    }

    function applyAll() {
      collect().forEach(apply);
    }

    var timer;
    function reapply() {
      clearTimeout(timer);
      timer = setTimeout(applyAll, 120);
    }

    applyAll();
    addEventListener("resize", reapply);
    // After the runtime has rendered, for anything it created.
    addEventListener("load", applyAll);
    // The controllers measure their anchors and redraw off resize; nudge them
    // once so they re-read the row rather than keeping numbers taken before the
    // conversion. Only on the initial pass — later passes ARE resize events.
    dispatchEvent(new Event("resize"));
  })();

  // The rest of home's guard. Its connector dots are SVG <animateMotion>, built
  // by the controller after load and rebuilt on every resize, so CSS cannot
  // reach them: 'animation: none' does not apply to SMIL. Removing each one as
  // it is inserted parks its dot at the path start instead of flying it along,
  // and covers the rebuilds too. Only home generates these; the observer is not
  // installed anywhere else.
  if (
    document.getElementById("s3hero-row") &&
    matchMedia("(prefers-reduced-motion: reduce)").matches
  ) {
    const strip = (node) => {
      if (node.nodeType !== 1) return;
      if (node.tagName === "animateMotion") node.remove();
      else node.querySelectorAll?.("animateMotion").forEach((el) => el.remove());
    };
    document.querySelectorAll("animateMotion").forEach((el) => el.remove());
    new MutationObserver((records) =>
      records.forEach((r) => r.addedNodes.forEach(strip))
    ).observe(document.documentElement, { childList: true, subtree: true });
  }
</script>

<style>
  /* Added by scripts/sync-hero-animations.mjs -- not from the design bundle. */
  /* Pin the rotation pivot to a box that every engine agrees on.
     The bundle writes transform-box:view-box with a pixel transform-origin
     on its concentric rings. That pair is only the ring's centre if view-box is
     honoured; resolved against the fill-box instead, the pixel pair is measured
     from the element's own bbox corner and every ring spins about a different
     off-centre point — the rings stop being concentric.
     Measured across all seventeen animations, the fill-box centre IS the
     declared pivot for every one of these elements to within a user unit, so
     'center' under an explicitly pinned fill-box is the same rotation with no
     dependency on view-box support. The one exception is measured out below. */
  [data-scan-ring],
  #bhHero [data-breathe],
  .hero-anim .hf-core,
  .hero-anim .hf-ripple,
  .hero-anim .hf-spin,
  .hero-anim .hf-spin-rev,
  .nCore,
  .nRipple,
  .nSpin,
  .nSpinRev {
    transform-box: fill-box !important;
    transform-origin: center !important;
  }

  /* !important, not higher specificity, and this is load-bearing rather than
     lazy. The bundles namespace every selector under the wrapper id -- the
     24 Aug cut's README states it as a rule -- so the file's own declaration is
     '#diHero [data-scan-ring]' at (1,1,0) where the selector above is (0,1,0).
     It loses on specificity no matter what order the sheets are in. That is
     exactly how this fix went missing: it worked while device-intelligence
     shipped an unscoped rule, then stopped the moment the new cut replaced the
     file, and the rings went back to being non-concentric in Safari with
     nothing in the diff to show it. Matching the namespacing here would only
     put us one bundle rename away from the same silent failure. */

  /* The one element whose fill box is not centred on its pivot: its bbox starts
     at (123.4, 101.7) and the bundle rotates it about (230, 220). */
  #bhHero [data-breathe] { transform-origin: 106.6px 118.3px !important; }
</style>
